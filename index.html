<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />

<title>Benchmarks</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  html, body, #root { margin: 0; padding: 0; min-height: 100%; background: #0a0f1e; }
  * { box-sizing: border-box; }
  :root {
    --bg: #0a0f1e; --surface: #111827; --surface-2: #1a2236; --line: #1e2d45;
    --text: #e8edf7; --muted: #6b7fa3; --accent: #38bdf8;
    --accent-soft: rgba(56,189,248,0.12); --good: #34d399; --good-soft: rgba(52,211,153,0.12);
    --warn: #fbbf24; --danger: #f87171;
  }
  body { font-family: 'Inter', system-ui, sans-serif; background: var(--bg); color: var(--text); -webkit-font-smoothing: antialiased; }

  /* Layout */
  .tab-root { padding: calc(18px + env(safe-area-inset-top)) 16px calc(80px + env(safe-area-inset-bottom)); }

  /* Header */
  .wt-header { margin-bottom: 12px; }
  .wt-header-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
  .wt-title { font-family: 'Oswald', sans-serif; font-weight: 700; font-size: 26px; letter-spacing: 0.04em; text-transform: uppercase; margin: 0; color: var(--text); }
  .wt-title span { color: var(--accent); }
  .wt-header-bottom { display: flex; gap: 8px; align-items: center; }
  .wt-export-btn { background: none; border: 1px solid var(--line); border-radius: 7px; color: var(--muted); font-family: 'Inter', sans-serif; font-size: 12px; font-weight: 600; padding: 6px 12px; cursor: pointer; }
  .wt-status-pill { font-size: 12px; color: var(--muted); border: 1px solid var(--line); border-radius: 20px; padding: 5px 10px; display: flex; align-items: center; gap: 5px; }
  .wt-status-pill.ready { border-color: rgba(52,211,153,0.4); color: var(--good); }
  .wt-status-pill .dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; }

  /* Status message */
  .wt-status { font-size: 12.5px; padding: 4px 0; margin-bottom: 8px; }
  .wt-status.error { color: var(--danger); } .wt-status.success { color: var(--good); } .wt-status.pending { color: var(--muted); }

  /* Date */
  .wt-date { width: 100%; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; color: var(--text); padding: 9px 12px; font-size: 15px; font-family: 'Inter', sans-serif; margin-bottom: 16px; }
  .wt-date::-webkit-calendar-picker-indicator { filter: invert(0.6) sepia(1) saturate(3) hue-rotate(175deg); }

  /* Workout day tabs */
  .wt-days { display: flex; gap: 8px; margin-bottom: 16px; }
  .wt-day-btn { flex: 1; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 10px 8px; cursor: pointer; text-align: left; transition: border-color 0.15s, background 0.15s; }
  .wt-day-btn.active { border-color: var(--accent); background: var(--accent-soft); }
  .wt-day-label { font-family: 'Oswald', sans-serif; font-weight: 600; font-size: 14px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); }
  .wt-day-btn.active .wt-day-label { color: var(--accent); }

  /* Progress bar */
  .wt-bar-wrap { display: flex; align-items: center; gap: 8px; margin-bottom: 18px; }
  .wt-bar-track { flex: 1; height: 3px; background: var(--line); border-radius: 2px; position: relative; overflow: hidden; }
  .wt-bar-fill { position: absolute; inset: 0; background: var(--accent); border-radius: 2px; transition: width 0.4s ease; }
  .wt-bar-count { font-family: 'Oswald', sans-serif; font-size: 12px; color: var(--muted); letter-spacing: 0.04em; white-space: nowrap; }

  /* Exercise card */
  .wt-exercise { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 14px; margin-bottom: 10px; transition: border-color 0.2s; }
  .wt-exercise.all-saved { border-color: rgba(52,211,153,0.35); }
  .wt-exercise-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; margin-bottom: 8px; }
  .wt-exercise-name { font-family: 'Oswald', sans-serif; font-weight: 600; font-size: 16px; color: var(--text); }
  .wt-exercise-meta { font-size: 12px; color: var(--muted); margin-top: 3px; }
  .wt-exercise-last { font-size: 11.5px; color: var(--accent); margin-top: 3px; opacity: 0.85; }
  .wt-exercise-suggestion { font-size: 11.5px; color: var(--warn); margin-top: 2px; }
  .wt-exercise-lastnotes { font-size: 11.5px; color: var(--muted); margin-top: 2px; font-style: italic; }
  .wt-video-link { background: none; flex-shrink: 0; width: 30px; height: 30px; display: flex; align-items: center; justify-content: center; border: 1px solid var(--line); border-radius: 50%; color: var(--muted); font-size: 11px; cursor: pointer; transition: border-color 0.15s, color 0.15s; }
  .wt-video-link:hover { border-color: var(--accent); color: var(--accent); }

  /* Per-set rows */
  .wt-set-row { display: grid; grid-template-columns: auto 1fr 1fr auto; gap: 8px; align-items: center; margin-bottom: 6px; }
  .wt-set-label { font-size: 11px; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: 0.06em; white-space: nowrap; }
  .wt-set-input { background: var(--surface-2); border: 1px solid var(--line); border-radius: 7px; color: var(--text); padding: 8px 10px; font-size: 16px; font-family: 'Inter', sans-serif; width: 100%; }
  .wt-set-input:focus { outline: none; border-color: var(--accent); }
  .wt-set-input.saved { border-color: rgba(52,211,153,0.35); background: rgba(52,211,153,0.05); }
  .wt-set-log-btn { background: var(--accent); color: #0a0f1e; border: none; border-radius: 7px; padding: 8px 12px; font-family: 'Inter', sans-serif; font-weight: 600; font-size: 13px; cursor: pointer; white-space: nowrap; transition: filter 0.15s; }
  .wt-set-log-btn:hover { filter: brightness(1.1); }
  .wt-set-log-btn.saved { background: var(--good-soft); color: var(--good); border: 1px solid rgba(52,211,153,0.35); }
  .wt-set-remove { background: none; border: none; color: var(--muted); font-size: 16px; cursor: pointer; padding: 4px; line-height: 1; }
  .wt-set-remove:hover { color: var(--danger); }
  .wt-set-headers { display: grid; grid-template-columns: auto 1fr 1fr auto; gap: 8px; margin-bottom: 4px; padding-right: 0; }
  .wt-set-header-label { font-size: 10px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.08em; }

  /* Notes row */
  .wt-notes-row { display: flex; gap: 8px; align-items: center; margin-top: 8px; }
  .wt-notes-input { flex: 1; background: var(--surface-2); border: 1px solid var(--line); border-radius: 7px; color: var(--text); padding: 8px 10px; font-size: 14px; font-family: 'Inter', sans-serif; }
  .wt-notes-input:focus { outline: none; border-color: var(--accent); }
  .wt-add-set-btn { background: none; border: 1px dashed var(--line); border-radius: 7px; color: var(--muted); font-family: 'Inter', sans-serif; font-size: 12px; font-weight: 600; padding: 6px 12px; cursor: pointer; margin-top: 6px; width: 100%; transition: border-color 0.15s, color 0.15s; }
  .wt-add-set-btn:hover { border-color: var(--accent); color: var(--accent); }

  /* Custom exercise */
  .wt-custom-section { margin-top: 20px; border-top: 1px solid var(--line); padding-top: 16px; }
  .wt-custom-title { font-family: 'Oswald', sans-serif; font-size: 13px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); margin-bottom: 12px; }
  .wt-custom-search { position: relative; margin-bottom: 8px; }
  .wt-custom-input { width: 100%; background: var(--surface-2); border: 1px solid var(--line); border-radius: 8px; color: var(--text); padding: 10px 12px; font-size: 15px; font-family: 'Inter', sans-serif; }
  .wt-custom-input:focus { outline: none; border-color: var(--accent); }
  .wt-custom-dropdown { position: absolute; top: 100%; left: 0; right: 0; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; z-index: 10; max-height: 200px; overflow-y: auto; margin-top: 4px; }
  .wt-custom-option { padding: 10px 12px; font-size: 14px; cursor: pointer; border-bottom: 1px solid var(--line); }
  .wt-custom-option:last-child { border-bottom: none; }
  .wt-custom-option:hover { background: var(--accent-soft); color: var(--accent); }
  .wt-custom-add-btn { background: var(--accent); color: #0a0f1e; border: none; border-radius: 8px; padding: 10px 16px; font-family: 'Inter', sans-serif; font-weight: 600; font-size: 14px; cursor: pointer; width: 100%; margin-bottom: 12px; }

  /* Finish workout button */
  .wt-finish-btn { width: 100%; background: none; border: 1px solid var(--accent); border-radius: 10px; color: var(--accent); font-family: 'Inter', sans-serif; font-weight: 600; font-size: 15px; padding: 14px; cursor: pointer; margin-top: 20px; transition: background 0.15s, color 0.15s; }
  .wt-finish-btn:hover { background: var(--accent-soft); }

  /* Finish summary modal */
  .wt-modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.85); display: flex; align-items: flex-end; justify-content: center; z-index: 50; }
  .wt-modal { background: var(--surface); border: 1px solid var(--line); border-top: 1px solid rgba(56,189,248,0.2); border-radius: 20px 20px 0 0; padding: 16px; width: 100%; max-width: 480px; display: flex; flex-direction: column; gap: 12px; max-height: 90vh; overflow-y: auto; }
  .wt-modal-handle { width: 36px; height: 4px; background: var(--line); border-radius: 2px; align-self: center; margin-bottom: 4px; }
  .wt-modal-title { font-family: 'Oswald', sans-serif; font-weight: 700; font-size: 22px; color: var(--text); }
  .wt-modal-title span { color: var(--accent); }
  .wt-summary-row { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--line); font-size: 14px; }
  .wt-summary-row:last-of-type { border-bottom: none; }
  .wt-summary-name { color: var(--text); font-weight: 500; }
  .wt-summary-detail { color: var(--muted); font-size: 13px; }
  .wt-summary-skipped { color: var(--muted); font-style: italic; }
  .wt-modal-confirm-btn { background: var(--accent); color: #0a0f1e; border: none; border-radius: 10px; padding: 14px; font-family: 'Inter', sans-serif; font-weight: 700; font-size: 15px; cursor: pointer; width: 100%; margin-top: 4px; }
  .wt-modal-cancel-btn { background: none; border: 1px solid var(--line); border-radius: 10px; padding: 12px; font-family: 'Inter', sans-serif; font-weight: 600; font-size: 14px; color: var(--muted); cursor: pointer; width: 100%; }

  /* Video modal */
  .wt-video-modal { background: var(--surface); border-radius: 20px 20px 0 0; padding: 16px; width: 100%; max-width: 480px; display: flex; flex-direction: column; align-items: center; gap: 12px; max-height: 90vh; overflow-y: auto; }
  .wt-modal-title-sm { font-family: 'Oswald', sans-serif; font-weight: 600; font-size: 18px; align-self: flex-start; color: var(--text); }
  .wt-video-toggle { display: flex; gap: 8px; width: 100%; }
  .wt-toggle-btn { flex: 1; background: var(--surface-2); border: 1px solid var(--line); border-radius: 7px; color: var(--muted); font-family: 'Inter', sans-serif; font-weight: 600; font-size: 13px; padding: 7px; cursor: pointer; }
  .wt-toggle-btn.active { border-color: var(--accent); color: var(--accent); background: var(--accent-soft); }
  .wt-modal-video { width: 100%; border-radius: 10px; display: block; background: #000; }
  .wt-modal-notes { margin: 0; padding-left: 18px; width: 100%; color: var(--muted); font-size: 13.5px; line-height: 1.6; }
  .wt-modal-notes li { margin-bottom: 6px; }
  .wt-modal-close { background: var(--surface-2); color: var(--muted); border: 1px solid var(--line); border-radius: 7px; padding: 10px 24px; font-family: 'Inter', sans-serif; font-weight: 600; font-size: 14px; cursor: pointer; width: 100%; }

  /* Bottom nav */
  .wt-nav { position: fixed; bottom: 0; left: 0; right: 0; background: var(--surface); border-top: 1px solid var(--line); display: flex; z-index: 40; padding-bottom: env(safe-area-inset-bottom); }
  .wt-nav-btn { flex: 1; background: none; border: none; cursor: pointer; padding: 10px 0 8px; display: flex; flex-direction: column; align-items: center; gap: 3px; color: var(--muted); font-family: 'Inter', sans-serif; font-size: 10px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; transition: color 0.15s; }
  .wt-nav-btn.active { color: var(--accent); }
  .wt-nav-icon { width: 22px; height: 22px; }

  /* Progress tab */
  .pg-title { font-family: 'Oswald', sans-serif; font-weight: 700; font-size: 26px; letter-spacing: 0.04em; text-transform: uppercase; margin: 0 0 4px; color: var(--text); }
  .pg-title span { color: var(--accent); }
  .pg-subtitle { font-size: 12px; color: var(--muted); margin-bottom: 20px; }
  .pg-select { width: 100%; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; color: var(--text); padding: 10px 12px; font-size: 15px; font-family: 'Inter', sans-serif; margin-bottom: 12px; }
  .pg-chart-toggle { display: flex; gap: 8px; margin-bottom: 16px; }
  .pg-toggle-btn { flex: 1; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; color: var(--muted); font-family: 'Inter', sans-serif; font-weight: 600; font-size: 13px; padding: 8px; cursor: pointer; }
  .pg-toggle-btn.active { border-color: var(--accent); color: var(--accent); background: var(--accent-soft); }
  .pg-stat-row { display: flex; gap: 8px; margin-bottom: 12px; }
  .pg-stat { flex: 1; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; }
  .pg-stat-label { font-size: 10px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 4px; }
  .pg-stat-value { font-family: 'Oswald', sans-serif; font-size: 20px; font-weight: 600; color: var(--text); }
  .pg-stat-unit { font-size: 11px; color: var(--muted); margin-left: 2px; }
  .pg-card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 16px; margin-bottom: 12px; }
  .pg-card-title { font-family: 'Oswald', sans-serif; font-size: 13px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); margin-bottom: 12px; }
  .pg-empty { text-align: center; color: var(--muted); font-size: 14px; padding: 40px 0; }
  .pg-axis-label { font-size: 9px; fill: var(--muted); font-family: 'Inter', sans-serif; }
</style>
</head>

<script type="text/babel" data-presets="react">
const { useState, useEffect, useRef } = React;

const FIREBASE_CONFIG = {
  apiKey: "AIzaSyC6TXH3gK0E6mJEe-uSkXTsGIVhopevNbI",

  projectId: "benchmarks-310fd",

const PLAN = {
  A: {
    label: 'Workout A',
    sub: 'Legs · Push · Pull',
    exercises: [
      { id: 'a1', name: 'Leg Press', scheme: '3 × 8–12', sets: 3, repRange: [8,12], rest: '2–3 min', videos: ['videos/Workout A/leg-press-front.mp4','videos/Workout A/leg-press-side.mp4'], formNotes: ['Place your legs on the platform with your feet at shoulder width.','Release the weight and extend your legs fully, without locking your knees.','Lower the weight until your legs are at a 90° angle (but DO NOT allow your butt and lower back to rise off of the pad).','Raise the weight back to starting position.'] },
      { id: 'a2', name: 'Bench Press', scheme: '3 × 6–10', sets: 3, repRange: [6,10], rest: '2–3 min', videos: ['videos/Workout A/bench-press-front.mp4','videos/Workout A/bench-press-side.mp4'], formNotes: ['Lay flat on the bench with your feet on the ground. With straight arms unrack the bar.','Lower the bar to your mid chest.','Raise the bar until you\'ve locked your elbows.'] },
      { id: 'a3', name: 'Lat Pulldown', scheme: '3 × 8–12', sets: 3, repRange: [8,12], rest: '60–90 sec', videos: ['videos/Workout A/lat-pulldown-front.mp4','videos/Workout A/lat-pulldown-side.mp4'], formNotes: ['Grip the bar with the palms facing forward, your hands need to be spaced out at a distance wider than shoulder width.','As you have both arms extended in front of you holding the bar, bring your torso back around 30 degrees while sticking your chest out.','Pull the bar down to about chin level or a little lower in a smooth movement whilst squeezing the shoulder blades together.','After a second of squeezing, slowly raise the bar back to the starting position when your arms are fully extended.'] },
      { id: 'a4', name: 'Romanian Deadlift', scheme: '2 × 8–10', sets: 2, repRange: [8,10], rest: '2–3 min', videos: ['videos/Workout A/romanian-deadlift-front.mp4','videos/Workout A/romanian-deadlift-side.mp4'], formNotes: ['Take a shoulder width, double overhand or mixed grip.','Push your hips back while leaving your knees mostly extended. Look for a stretch in your hamstrings.','When you feel the stretch, push your hips forward until you\'re back in a standing position.'] },
      { id: 'a5', name: 'Lateral Raise', scheme: '2 × 10–15', sets: 2, repRange: [10,15], rest: '45–75 sec', videos: ['videos/Workout A/dumbbell-lateral-raise-front.mp4','videos/Workout A/dumbbell-lateral-raise-side.mp4'], formNotes: ['Stand up straight with dumbbells at either side, palms facing your hips.','Raise your arms on either side with a slight bend in your elbow until they are parallel with the floor. Pause at the top of the motion.','Slowly return your arms down to starting position.'] },
      { id: 'a6', name: 'Plank', scheme: '2 × 30–60 sec', sets: 2, repRange: [30,60], rest: '45–75 sec', videos: ['videos/Workout A/plank-front.mp4','videos/Workout A/plank-side.mp4'], formNotes: ['Place forearms on the ground with your elbows bent at a 90° angle aligned beneath your shoulders, with your arms parallel at shoulder-width.','Your feet should be together, with only your toes touching the floor.','Lift your belly off the floor and form a straight line from your heels to the crown of your head and hold.'] },
    ],
  },
  B: {
    label: 'Workout B',
    sub: 'Pull · Push · Legs',
    exercises: [
      { id: 'b1', name: 'Deadlift', scheme: '2 × 5–8', sets: 2, repRange: [5,8], rest: '2–3 min', videos: ['videos/Workout B/deadlift-front.mp4','videos/Workout B/deadlift-side.mp4'], formNotes: ['Stand with your mid-foot under the bar and grip the bar with your hands, about a shoulder width apart.','Bend your knees, then lift the bar by straightening your back. It is important to keep your back straight.','Stand to your full height and hold.','Lower the bar to the floor by bending your knees and keeping your back straight.'] },
      { id: 'b2', name: 'Dumbbell Shoulder Press', scheme: '3 × 6–10', sets: 3, repRange: [6,10], rest: '2–3 min', videos: ['videos/Workout B/dumbbell-shoulder-press-front.mp4','videos/Workout B/dumbbell-shoulder-press-side.mp4'], formNotes: ['Sit on a bench with back support. Raise the dumbbells to shoulder height with your palms forward.','Raise the dumbbells upwards and pause at the contracted position.','Lower the weights back to starting position.'] },
      { id: 'b3', name: 'Seated Cable Row', scheme: '3 × 8–12', sets: 3, repRange: [8,12], rest: '60–90 sec', videos: ['videos/Workout B/seated-cable-row-front.mp4','videos/Workout B/seated-cable-row-side.mp4'], formNotes: ['Sit with your back straight on the machine and grip the handles.','Pull the handles back using your arms. Your legs and torso should be at a 90° angle. Push out your chest.','Pull the handles towards your body until your hands are beside your abdomen.'] },
      { id: 'b4', name: 'Bulgarian Split Squat', scheme: '2 × 8–10 / leg', sets: 2, repRange: [8,10], rest: '60–90 sec', videos: ['videos/Workout B/bulgarian-split-squat-front.mp4','videos/Workout B/bulgarian-split-squat-side.mp4'], formNotes: ['Find a box or bench that is roughly knee height or a few inches lower.','You can either place your toes or the top of your foot on the box. Point your front foot forward or slightly turned outwards and break at the knees and hips simultaneously.','Aim to get your front leg to hit parallel depth (hamstring parallel with the ground) or lower.','The further forward your front foot is, the longer the Range of Motion is at your hips.'] },
      { id: 'b5', name: 'Dumbbell Curl', scheme: '2 × 10–15', sets: 2, repRange: [10,15], rest: '45–75 sec', videos: ['videos/Workout B/dumbbell-curl-front.mp4','videos/Workout B/dumbbell-curl-side.mp4'], formNotes: ['Stand up straight with a dumbbell in each hand at arm\'s length.','Raise one dumbbell and twist your forearm until it is vertical and your palm faces the shoulder.','Lower to original position and repeat with opposite arm.'] },
      { id: 'b6', name: 'Pallof Press', scheme: '2 × 10–15 / side', sets: 2, repRange: [10,15], rest: '45–75 sec', videos: ['videos/Workout B/pallof-press-front.mp4','videos/Workout B/pallof-press-side.mp4'], formNotes: ['Use a handle attachment, set the cable at nipple level, walk a few steps away, and face sideways.','Start with both hands on the handle and your fists against your chest.','Press the handle forward until your elbows are fully extended, then pull the handle back to your chest.'] },
    ],
  },
  C: {

const WORKOUT_ORDER = ['A','B','C'];
const ALL_PLAN_EXERCISES = Object.values(PLAN).flatMap(d => d.exercises.map(e => e.name));

function todayISO() {
  const d = new Date();
  return new Date(d.getTime() - d.getTimezoneOffset() * 60000).toISOString().slice(0, 10);
}

function nextWorkout(current) {
  const idx = WORKOUT_ORDER.indexOf(current);
  return WORKOUT_ORDER[(idx + 1) % WORKOUT_ORDER.length];
}

function suggestWeight(lastWeight, lastSets, repRangeMax) {
  if (!lastWeight) return null;
  const w = parseFloat(lastWeight);
  if (isNaN(w)) return null;
  const allHitMax = lastSets.length > 0 && lastSets.every(s => parseInt(s.reps) >= repRangeMax);
  if (!allHitMax) return null;
  const increase = Math.max(5, Math.round((w * 0.04) / 5) * 5);
  return w + increase;
}

function useFirebase() {
  const [db, setDb] = useState(null);
  useEffect(() => {
    const script = document.createElement('script');
    script.type = 'module';
    script.textContent = `
      import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
      import { getFirestore, collection, addDoc, getDocs, doc, setDoc, getDoc, query, orderBy } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
      const app = initializeApp(${JSON.stringify(FIREBASE_CONFIG)});
      const db = getFirestore(app);
      window.__db = db;
      window.__fbFns = { collection, addDoc, getDocs, doc, setDoc, getDoc, query, orderBy };
      window.dispatchEvent(new Event('fb-ready'));
    `;
    document.head.appendChild(script);
    const handler = () => setDb(window.__db);
    window.addEventListener('fb-ready', handler, { once: true });
    return () => window.removeEventListener('fb-ready', handler);
  }, []);
  return db;
}

function ExerciseCard({ ex, setRows, onUpdateRows, lastData, db }) {
  const rows = setRows[ex.id] || Array.from({length: ex.sets || 3}, () => ({ reps: '', weight: '', saved: false }));

  const updateRow = (i, field, val) => {
    const next = rows.map((r,idx) => idx===i ? {...r, [field]: val, saved: false} : r);
    onUpdateRows(ex.id, next);
  };

  const logRow = async (i) => {
    if (!db) return;
    const row = rows[i];
    try {
      const { collection, addDoc } = window.__fbFns;
      await addDoc(collection(db, 'workoutLogs'), {
        date: todayISO(),
        exercise: ex.name,
        sets: '1',
        reps: row.reps || '',
        weight: row.weight || '',
        notes: '',
        setIndex: i,
        createdAt: new Date().toISOString(),
      });
      const next = rows.map((r,idx) => idx===i ? {...r, saved: true} : r);
      onUpdateRows(ex.id, next);
    } catch(e) {
      console.error(e);
    }
  };

  const addRow = () => {
    onUpdateRows(ex.id, [...rows, { reps: '', weight: '', saved: false }]);
  };

  const removeRow = (i) => {
    if (rows.length <= 1) return;
    onUpdateRows(ex.id, rows.filter((_,idx) => idx !== i));
  };

  const lastWeight = lastData?.lastWeight;
  const lastNotes = lastData?.lastNotes;
  const suggestion = suggestWeight(lastWeight, lastData?.lastSets || [], ex.repRange?.[1] || 12);
  const allSaved = rows.length > 0 && rows.every(r => r.saved);

  return (
    <div className={`wt-exercise${allSaved?' all-saved':''}`}>
      <div className="wt-exercise-head">
        <div>
          <div className="wt-exercise-name">{ex.name}</div>
          <div className="wt-exercise-meta">{ex.scheme} · {ex.rest}</div>
          {lastWeight && <div className="wt-exercise-last">Last: {lastWeight} lbs</div>}
          {suggestion && <div className="wt-exercise-suggestion">↑ Suggested: {suggestion} lbs</div>}
          {lastNotes && <div className="wt-exercise-lastnotes">"{lastNotes}"</div>}
        </div>
        {ex.videos && <button className="wt-video-link" onClick={() => onUpdateRows('__modal__', ex)}>▶</button>}
      </div>
      <div className="wt-set-headers">
        <div style={{width:'36px'}}/>
        <div className="wt-set-header-label">Reps</div>
        <div className="wt-set-header-label">Weight (lbs)</div>
        <div style={{width:'54px'}}/>
      </div>
      {rows.map((row, i) => (
        <div key={i} className="wt-set-row">
          <div className="wt-set-label">S{i+1}</div>
          <input className={`wt-set-input${row.saved?' saved':''}`} type="text" inputMode="numeric" value={row.reps} onChange={e => updateRow(i,'reps',e.target.value)} />
          <input className={`wt-set-input${row.saved?' saved':''}`} type="text" inputMode="decimal" value={row.weight} onChange={e => updateRow(i,'weight',e.target.value)} />
          <div style={{display:'flex',gap:'4px',alignItems:'center'}}>
            <button className={`wt-set-log-btn${row.saved?' saved':''}`} onClick={() => logRow(i)}>{row.saved?'✓':'Log'}</button>
            <button className="wt-set-remove" onClick={() => removeRow(i)} title="Remove set">×</button>
          </div>
        </div>
      ))}
      <button className="wt-add-set-btn" onClick={addRow}>+ Add set</button>
    </div>
  );
}

function LineChart({ data, color, gradId }) {
  if (!data || data.length < 1) return null;
  const W=320, H=140, PL=42, PR=8, PT=8, PB=28;
  const vals = data.map(d=>d.v);
  const minV = Math.min(...vals), maxV = Math.max(...vals);
  const range = maxV - minV || 1;
  const xs = data.map((_,i) => PL + (i/Math.max(data.length-1,1))*(W-PL-PR));
  const ys = data.map(d => PT + (1-(d.v-minV)/range)*(H-PT-PB));
  const line = xs.map((x,i) => `${i===0?'M':'L'}${x.toFixed(1)},${ys[i].toFixed(1)}`).join(' ');
  const area = line + ` L${xs[xs.length-1].toFixed(1)},${(H-PB).toFixed(1)} L${xs[0].toFixed(1)},${(H-PB).toFixed(1)} Z`;
  const ticks = [minV, minV+range*0.5, maxV].map(v=>Math.round(v));
  const xLabels = data.length<=5 ? data : [data[0], data[Math.floor(data.length/2)], data[data.length-1]];
  return (
    <svg viewBox={`0 0 ${W} ${H}`} style={{width:'100%',overflow:'visible'}}>
      <defs>
        <linearGradient id={gradId} x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stopColor={color} stopOpacity="0.35"/>
          <stop offset="100%" stopColor={color} stopOpacity="0"/>
        </linearGradient>
      </defs>
      {ticks.map((t,i) => {
        const y = PT + (1-(t-minV)/range)*(H-PT-PB);
        return <g key={i}>
          <line x1={PL} y1={y.toFixed(1)} x2={W-PR} y2={y.toFixed(1)} stroke="var(--line)" strokeWidth="1" strokeDasharray="3,3"/>
          <text x={PL-4} y={y+3} className="pg-axis-label" textAnchor="end">{t}</text>
        </g>;
      })}
      {xLabels.map((d,i) => {
        const idx = data.indexOf(d);
        return <text key={i} x={xs[idx].toFixed(1)} y={H-4} className="pg-axis-label" textAnchor="middle">{d.label}</text>;
      })}
      <path d={area} fill={`url(#${gradId})`}/>
      <path d={line} fill="none" stroke={color} strokeWidth="2" strokeLinejoin="round" strokeLinecap="round"/>
      {xs.map((x,i) => <circle key={i} cx={x.toFixed(1)} cy={ys[i].toFixed(1)} r="3" fill={color}/>)}
    </svg>
  );
}

function ProgressTab({ allLogs, pastCustomNames }) {
  const allExercises = [...new Set([...ALL_PLAN_EXERCISES, ...pastCustomNames])];
  const [selectedEx, setSelectedEx] = useState(allExercises[0] || '');
  const [chartType, setChartType] = useState('weight');

  // Group by date, average weight per session
  const byDate = {};
  allLogs.filter(d => d.exercise===selectedEx && d.weight).forEach(d => {
    if (!byDate[d.date]) byDate[d.date] = [];
    byDate[d.date].push(parseFloat(d.weight)||0);
  });
  const weightData = Object.entries(byDate).sort(([a],[b])=>a.localeCompare(b)).map(([date,ws]) => ({
    label: date.slice(5),
    v: Math.round(ws.reduce((a,b)=>a+b,0)/ws.length),
  }));

  const volByDate = {};
  allLogs.filter(d => d.exercise===selectedEx && d.weight && d.reps).forEach(d => {
    if (!volByDate[d.date]) volByDate[d.date] = 0;
    volByDate[d.date] += (parseFloat(d.reps)||0)*(parseFloat(d.weight)||0);
  });
  const volumeData = Object.entries(volByDate).sort(([a],[b])=>a.localeCompare(b)).map(([date,v]) => ({
    label: date.slice(5), v: Math.round(v),
  }));

  const data = chartType==='weight' ? weightData : volumeData;
  const unit = chartType==='weight' ? 'lbs' : 'vol';
  const best = data.length ? Math.max(...data.map(d=>d.v)) : null;
  const latest = data.length ? data[data.length-1].v : null;
  const gain = data.length>=2 ? data[data.length-1].v - data[0].v : null;

  return (
    <div className="tab-root">
      <h1 className="pg-title">Pro<span>gress</span></h1>
      <div className="pg-subtitle">{allLogs.length} sets logged total</div>
      <select className="pg-select" value={selectedEx} onChange={e=>setSelectedEx(e.target.value)}>
        {allExercises.map(ex=><option key={ex} value={ex}>{ex}</option>)}
      </select>
      <div className="pg-chart-toggle">
        <button className={`pg-toggle-btn${chartType==='weight'?' active':''}`} onClick={()=>setChartType('weight')}>Weight</button>
        <button className={`pg-toggle-btn${chartType==='volume'?' active':''}`} onClick={()=>setChartType('volume')}>Volume</button>
      </div>
      {data.length===0 ? (
        <div className="pg-empty">No data yet for {selectedEx}.</div>
      ) : (
        <>
          <div className="pg-stat-row">
            <div className="pg-stat"><div className="pg-stat-label">Latest</div><div className="pg-stat-value">{Math.round(latest)}<span className="pg-stat-unit">{unit}</span></div></div>
            <div className="pg-stat"><div className="pg-stat-label">Best</div><div className="pg-stat-value">{Math.round(best)}<span className="pg-stat-unit">{unit}</span></div></div>
            <div className="pg-stat"><div className="pg-stat-label">Gained</div><div className="pg-stat-value">{gain!==null?(gain>=0?'+':'')+Math.round(gain):'—'}<span className="pg-stat-unit">{unit}</span></div></div>
          </div>
          <div className="pg-card">
            <div className="pg-card-title">{chartType==='weight'?'Avg weight per session':'Volume per session'}</div>
            <LineChart data={data} color={chartType==='weight'?'#38bdf8':'#34d399'} gradId={chartType==='weight'?'grad1':'grad2'}/>
          </div>
        </>
      )}
    </div>
  );
}

function App() {
  const db = useFirebase();
  const [tab, setTab] = useState('workout');
  const [dayKey, setDayKey] = useState('B'); // start on B per user request
  const [date, setDate] = useState(todayISO());
  const [setRows, setSetRowsState] = useState({});
  const [videoModal, setVideoModal] = useState(null);
  const [showFinish, setShowFinish] = useState(false);
  const [customExercises, setCustomExercises] = useState([]);
  const [allLogs, setAllLogs] = useState([]);
  const [lastDataMap, setLastDataMap] = useState({});
  const [pastCustomNames, setPastCustomNames] = useState([]);
  const [status, setStatus] = useState(null);
  const [nextWorkoutKey, setNextWorkoutKey] = useState(null);

  useEffect(() => {
    if (!db) return;
    (async () => {
      try {
        const { collection, getDocs, doc, getDoc, query, orderBy } = window.__fbFns;

        // Load next workout from Firestore meta
        const metaSnap = await getDoc(doc(db, 'meta', 'workout'));
        if (metaSnap.exists()) {
          const next = metaSnap.data().nextWorkout;
          if (next && WORKOUT_ORDER.includes(next)) {
            setDayKey(next);
          }
        }

        // Load all logs
        const q = query(collection(db, 'workoutLogs'), orderBy('date', 'asc'));
        const snap = await getDocs(q);
        const logs = [];
        snap.forEach(doc => logs.push(doc.data()));
        setAllLogs(logs);

        // Build last data map per exercise
        const lastMap = {};
        const customNames = new Set();
        logs.forEach(d => {
          if (!ALL_PLAN_EXERCISES.includes(d.exercise)) customNames.add(d.exercise);
          if (!lastMap[d.exercise]) lastMap[d.exercise] = { lastWeight: null, lastNotes: null, lastSets: [], lastDate: null };
          const entry = lastMap[d.exercise];
          if (!entry.lastDate || d.date > entry.lastDate) {
            entry.lastDate = d.date;
            entry.lastWeight = d.weight || entry.lastWeight;
            entry.lastNotes = d.notes || entry.lastNotes;
          }
          if (d.date === entry.lastDate && d.weight) {
            entry.lastSets.push({ reps: d.reps, weight: d.weight });
          }
        });
        setLastDataMap(lastMap);
        setPastCustomNames([...customNames]);
      } catch(e) { console.error(e); }
    })();
  }, [db]);

  const onUpdateRows = (id, val) => {
    if (id === '__modal__') { setVideoModal(val); return; }
    setSetRowsState(prev => ({ ...prev, [id]: val }));
  };

  const addCustomExercise = (name) => {
    const id = `custom_${Date.now()}`;
    setCustomExercises(prev => [...prev, { id, name, scheme: 'Custom', sets: 3, repRange: [8,12], rest: '—' }]);
  };

  const handleFinish = async () => {
    setShowFinish(false);
    if (!db) return;
    try {
      const { doc, setDoc } = window.__fbFns;
      const next = nextWorkout(dayKey);
      await setDoc(doc(db, 'meta', 'workout'), { nextWorkout: next, lastCompleted: dayKey, lastDate: todayISO() });
      setNextWorkoutKey(next);
    } catch(e) { console.error(e); }
    // Reset
    setSetRowsState({});
    setCustomExercises([]);
    setStatus({ type: 'success', text: `Workout ${dayKey} complete! Next up: Workout ${nextWorkout(dayKey)}.` });
    setDayKey(nextWorkout(dayKey));
  };

  const exportCSV = async () => {
    if (!db) return;
    try {
      const { collection, getDocs, query, orderBy } = window.__fbFns;
      const q = query(collection(db,'workoutLogs'), orderBy('date','asc'));
      const snap = await getDocs(q);
      const rows = [['Date','Exercise','Set','Reps','Weight','Notes']];
      snap.forEach(doc => { const d=doc.data(); rows.push([d.date,d.exercise,d.setIndex!=null?d.setIndex+1:'',d.reps,d.weight,d.notes]); });
      const csv = rows.map(r=>r.map(v=>`"${(v||'').toString().replace(/"/g,'""')}"`).join(',')).join('\n');
      const a = document.createElement('a');
      a.href = URL.createObjectURL(new Blob([csv],{type:'text/csv'}));
      a.download = `benchmarks-${todayISO()}.csv`;
      a.click();
    } catch(e) { setStatus({ type:'error', text:'Export failed.' }); }
  };

  const plan = PLAN[dayKey];
  const totalSets = plan.exercises.reduce((acc, ex) => acc + Math.max((setRows[ex.id]||[]).length, ex.sets), 0);
  const savedSets = plan.exercises.reduce((acc, ex) => acc + (setRows[ex.id]||[]).filter(r=>r.saved).length, 0);

  return (
    <div style={{minHeight:'100vh',background:'var(--bg)'}}>
      {tab === 'progress' ? (
        <ProgressTab allLogs={allLogs} pastCustomNames={pastCustomNames} />
      ) : (
        <div className="tab-root">
          <div className="wt-header">
            <div className="wt-header-top">
              <h1 className="wt-title">Bench<span>marks</span></h1>
            </div>
            <div className="wt-header-bottom">
              <button className="wt-export-btn" onClick={exportCSV}>Export CSV</button>
              <div className={`wt-status-pill${db?' ready':''}`}>
                <span className="dot"/>
                {db ? 'Live' : 'Connecting…'}
              </div>
            </div>
          </div>

          {status && <div className={`wt-status ${status.type}`}>{status.text}</div>}

          <input className="wt-date" type="date" value={date} onChange={e=>setDate(e.target.value)} />

          <div className="wt-days">
            {WORKOUT_ORDER.map(key => (
              <button key={key} className={`wt-day-btn${dayKey===key?' active':''}`} onClick={()=>setDayKey(key)}>
                <div className="wt-day-label">Workout {key}</div>
              </button>
            ))}
          </div>

          <div className="wt-bar-wrap">
            <div className="wt-bar-track"><div className="wt-bar-fill" style={{width:totalSets>0?`${(savedSets/totalSets)*100}%`:'0%'}}/></div>
            <div className="wt-bar-count">{savedSets}/{totalSets} sets</div>
          </div>

          {plan.exercises.map(ex => (
            <ExerciseCard
              key={ex.id}
              ex={ex}
              setRows={setRows}
              onUpdateRows={onUpdateRows}
              lastData={lastDataMap[ex.name] || null}
              db={db}
            />
          ))}

          <CustomExerciseSection
            customExercises={customExercises}
            setRows={setRows}
            onUpdateRows={onUpdateRows}
            onAddExercise={addCustomExercise}
            pastCustomNames={pastCustomNames}
            db={db}
          />

          <button className="wt-finish-btn" onClick={() => setShowFinish(true)}>Finish Workout</button>
        </div>
      )}

      {videoModal && <VideoModal ex={videoModal} onClose={() => setVideoModal(null)} />}

      {showFinish && (
        <FinishModal
          plan={plan}
          setRows={setRows}
          customExercises={customExercises}
          onConfirm={handleFinish}
          onCancel={() => setShowFinish(false)}
        />
      )}

      <nav className="wt-nav">
        <button className={`wt-nav-btn${tab==='workout'?' active':''}`} onClick={()=>setTab('workout')}>
          <IconDumbbell/>Workout
        </button>
        <button className={`wt-nav-btn${tab==='progress'?' active':''}`} onClick={()=>setTab('progress')}>
          <IconChart/>Progress
        </button>
      </nav>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
